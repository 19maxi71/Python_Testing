{% extends "base_template.html" %}

{% block title %}Booking for {{competition['name']}} || GUDLFT{% endblock %}

{% block content %}
    <div class="container mt-5">
        <h2>{{ competition['name'] }}</h2>
        <p>Places available: {{ competition['numberOfPlaces'] }}</p>
        <form action="/purchasePlaces" method="post" class="mb-3">
            <input type="hidden" name="club" value="{{ club['name'] }}">
            <input type="hidden" name="competition" value="{{ competition['name'] }}">
            <div class="mb-3">
                <label for="places" class="form-label">How many places?</label>
                <input type="number" name="places" id="places" class="form-control" min="1" required>
            </div>
            <button type="submit" class="btn btn-primary">Book</button>
        </form>
    </div>
    <div class="container mt-3">
        <button onclick="history.back()"class="btn btn-secondary">Go Back</button>
    </div>
{% endblock %}
