{% extends "base_template.html" %}

{% block title %}GUDLFT Registration{% endblock %}

{% block content %}
    <div class="container mt-5">
        <h1>Welcome to the GUDLFT Registration Portal!</h1>
        <h3>Please enter your secretary email to continue:</h3>

        <form action="{{ url_for('showSummary') }}" method="post">
            <div class="mb-3">
                <label for="email" class="form-label">Email address</label>
                <input type="email" class="form-control" name="email" id="email" aria-describedby="emailHelp" required>
                <div id="emailHelp" class="form-text">We'll never share your email with anyone else.</div>
            </div>
            <button type="submit" class="btn btn-primary">Submit</button>
        </form>

        <div class="position-relative mt-5">
            <a href="{{ url_for('clubsPoints') }}" class="btn btn-success" role="button">View All Clubs Points</a>
        </div>
    </div>
{% endblock %}
